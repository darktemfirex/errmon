<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오류 모니터링 · 조치 우선순위</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <div>
        <h1>오류 모니터링 · 조치 우선순위</h1>
        <p class="sub" id="period">데이터를 불러오는 중…</p>
      </div>
      <div class="actions">
        <label class="btn primary" for="file">엑셀 불러오기</label>
        <input id="file" type="file" multiple accept=".xlsx,.xls,.csv" hidden>
        <button class="btn" id="reset" type="button">내장 데이터</button>
        <button class="btn" id="csv" type="button">우선순위 CSV</button>
      </div>
    </div>
  </header>

  <div id="msg" class="msg hide" role="status"></div>

  <main id="app">
    <section id="sec-kpi" class="kpis"></section>
    <section id="sec-must"></section>
    <section id="sec-table"></section>
    <section id="sec-trend"></section>
    <section id="sec-method"></section>
  </main>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
